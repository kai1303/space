<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
  <title>Space workspace</title>
  <link rel="stylesheet" href="../../assets/browser-style/toolbar.css">
</head>
<body>
  <div id="divider" role="separator" tabindex="0" aria-label="Chat width" aria-orientation="vertical" title="Drag to resize"></div>
  <header>
    <div class="row strip">
      <nav id="tabs" aria-label="Workspace tabs"></nav>
      <button id="add-tool" class="icon" aria-label="Add a tab" aria-expanded="false" aria-controls="tools" title="Add a tab"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <span class="spacer"></span>
      <button id="layout" class="icon" aria-label="Enter full view" title="Enter full view"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path id="layout-glyph" d="M6 2.5v11"/></svg></button>
      <button id="space" class="icon" title="Hide workspace tabs" aria-label="Hide workspace tabs"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
    </div>
    <div id="tool-slot"></div>
    <div id="navigation" class="row navigation">
      <div class="row history" role="group" aria-label="Page navigation">
        <button id="back" class="icon" aria-label="Back" title="Back"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9.5 3-5 5 5 5"/></svg></button>
        <button id="forward" class="icon" aria-label="Forward" title="Forward"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6.5 3 5 5-5 5"/></svg></button>
        <button id="reload" class="icon" aria-label="Reload" title="Reload"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 6a5.2 5.2 0 1 0 .1 4M13 2.5V6H9.5"/></svg></button>
      </div>
      <div id="address-slot"><form id="navigate"><svg class="site-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><ellipse cx="8" cy="8" rx="2.6" ry="6"/><path d="M2 8h12"/></svg><input id="address" type="text" autocomplete="off" spellcheck="false" aria-label="Website address" placeholder="Enter a website address" required><button class="icon" id="visit" aria-label="Open website" title="Open website"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10m-5-5 5 5-5 5"/></svg></button></form></div>
      <button id="vault" hidden title="Open your personal Vault on this Mac">Vault</button>
      <button id="sidekick" class="action" title="Open a private session with your paired agent">Ask my agent</button>
      <button id="ask" class="action" aria-expanded="false" aria-controls="task"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m7 2 1.5 4.5L13 8l-4.5 1.5L7 14l-1.5-4.5L1 8l4.5-1.5Z"/></svg>Control tab</button><button id="stop" class="action" hidden>Take over</button>
    </div>
    <section id="mcp-suggestion" aria-label="MCP connection suggestion" hidden>
      <strong id="mcp-title"></strong>
      <div id="mcp-endpoint"></div>
      <p>Connect your account and choose which tools your agent can use.</p>
      <button id="connect-mcp" class="primary">Connect</button><button id="mcp-guide">Setup guide</button><button id="dismiss-mcp">Not now</button>
    </section>
    <div id="manual-sign-in" hidden>Finish signing in on this tab. <button id="resume-control">Resume browser control</button></div>
    <form id="task" hidden><label for="goal">What would you like Codex to do?</label><div class="row task-entry"><input id="goal" maxlength="1000" required aria-describedby="task-scope" placeholder="Describe a task"><button id="cancel" type="button">Cancel</button><button class="primary">Start task</button></div><p id="task-scope">Codex can see and control this tab until you take over.</p></form>
    <div id="feedback" hidden><output id="notice" aria-live="polite"></output><button id="dismiss" aria-label="Dismiss message">×</button></div>
  </header>
  <main id="workspace-start" hidden>
    <section><h1 id="tools-heading">Open a tool</h1><div id="start-tools">
      <div id="tools" role="group" aria-label="Workspace tools">
        <button id="fill-login" hidden>Fill saved login</button>
        <div id="launch-tools">
        <button id="new"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><ellipse cx="8" cy="8" rx="2.6" ry="6"/><path d="M2 8h12"/></svg>Web Browser</button>
        <button id="office"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6l4 4v9H3zM9 1.5v4h4M5.5 9h5m-5 2.5h4"/></svg>Office editor</button>
        <button id="manage" aria-controls="plugins">Manage plugins</button>
        </div>
        <section id="plugins" aria-label="Manage plugins" hidden>
          <div class="plugins-heading"><strong>Manage plugins</strong><button id="plugins-done">Done</button></div>
          <div class="plugin-row"><span>Office editor</span><button data-plugin="office">Install</button></div>
          <div class="plugin-row"><span>Web Browser</span><button data-plugin="browser">Install</button></div>
        </section>
      </div>
    </div></section>
  </main>
  <main id="start" hidden>
    <div class="start-content">
      <img class="space-mark" src="../../assets/space-icon.png" width="64" height="64" alt="Space">
      <h1>Open a website</h1>
      <div id="start-address-slot"></div>
    </div>
  </main>
  <script src="../../assets/browser-style/toolbar.js"></script>
</body></html>
