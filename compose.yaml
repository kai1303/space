services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
      # Reduce write bursts on the shared local development volume.
      - -c
      - wal_compression=lz4
      - -c
      - wal_init_zero=off
      - -c
      - autovacuum_vacuum_cost_limit=50
    environment:
      POSTGRES_USER: workplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: workplace
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workplace -d workplace"]
      interval: 2s
      timeout: 5s
      retries: 20
  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir=/data", "--api-key=${TYPESENSE_API_KEY:-space_local_search}"]
    ports:
      - "127.0.0.1:58108:8108"
    volumes:
      - typesense_data:/data
    restart: unless-stopped
  nats:
    image: nats:2.15.2-alpine
    command: ["-c", "/etc/nats/space.conf"]
    ports:
      - "127.0.0.1:54222:4222"
    volumes:
      - nats_data:/data
      - ./config/nats.conf:/etc/nats/space.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      # Local development defaults. Supply separate secrets for a deployment.
      AWS_ACCESS_KEY_ID: ${ASSET_STORAGE_ACCESS_KEY:-space_local_dev}
      AWS_SECRET_ACCESS_KEY: ${ASSET_STORAGE_SECRET_KEY:-space_local_dev_secret}
      S3_BUCKET: ${ASSET_STORAGE_BUCKET:-space-assets}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
  migrate:
    build: .
    environment: &database
      DATABASE_URL: postgres://workplace:${POSTGRES_PASSWORD:-local_demo_only}@postgres:5432/workplace
    volumes:
      - memory_data:/app/.space-memory:ro
    command: ["node", "scripts/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  events:
    build: .
    environment:
      <<: *database
      NODE_ENV: development
      NATS_URL: nats://nats:4222
    command: ["node", "apps/events/dist/main.js"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
  server:
    build: .
    environment:
      <<: *database
      NATS_URL: nats://nats:4222
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-space_local_search}
      XAI_API_KEY: ${XAI_API_KEY:-}
      CALL_STUN_URLS: ${CALL_STUN_URLS:-}
      CALL_TURN_URLS: ${CALL_TURN_URLS:-}
      CALL_TURN_SECRET: ${CALL_TURN_SECRET:-}
      CALL_ICE_RELAY_ONLY: ${CALL_ICE_RELAY_ONLY:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      HOST: 0.0.0.0
      NODE_ENV: development
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:5173}
      SPACE_CLOUD_CONNECTORS: ${SPACE_CLOUD_CONNECTORS:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-127.0.0.1:7233}
      SPACE_WORKFLOW_TOKEN: ${SPACE_WORKFLOW_TOKEN:-}
      SPACE_WORKFLOW_WORKSPACE_ID: ${SPACE_WORKFLOW_WORKSPACE_ID:-}
      SPACE_WORKFLOW_ACTOR_ID: ${SPACE_WORKFLOW_ACTOR_ID:-}
      SPACE_WORKFLOW_HELP_CHANNEL_ID: ${SPACE_WORKFLOW_HELP_CHANNEL_ID:-}
      SPACE_WORKFLOW_ON_CALL_CHANNEL_ID: ${SPACE_WORKFLOW_ON_CALL_CHANNEL_ID:-}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:5173,http://127.0.0.1:5174}
      ALLOW_DEVELOPMENT_TOKENS: ${ALLOW_DEVELOPMENT_TOKENS:-false}
      MEMORY_MCP_ALLOWED_HOSTS: ${MEMORY_MCP_ALLOWED_HOSTS:-}
      REDIS_URL: redis://redis:6379
      ASSET_STORAGE_ENDPOINT: http://seaweedfs:8333
      ASSET_STORAGE_PUBLIC_ENDPOINT: ${ASSET_STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:-space-assets}
      ASSET_STORAGE_ACCESS_KEY: ${ASSET_STORAGE_ACCESS_KEY:-space_local_dev}
      ASSET_STORAGE_SECRET_KEY: ${ASSET_STORAGE_SECRET_KEY:-space_local_dev_secret}
      ASSET_STORAGE_ORIGINS: ${ASSET_STORAGE_ORIGINS:-http://127.0.0.1:5173,http://127.0.0.1:5174}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
  worker:
    build: .
    environment:
      <<: *database
      NODE_ENV: development
      NATS_URL: nats://nats:4222
      NAVIGATOR_L1_PROVIDER: ${NAVIGATOR_L1_PROVIDER:-compatible}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      NAVIGATOR_L1_YES_THRESHOLD: ${NAVIGATOR_L1_YES_THRESHOLD:-0.7}
      NAVIGATOR_L1_NO_THRESHOLD: ${NAVIGATOR_L1_NO_THRESHOLD:-0.3}
      NAVIGATOR_L1_URL: ${NAVIGATOR_L1_URL:-}
      NAVIGATOR_L1_MODEL: ${NAVIGATOR_L1_MODEL:-}
      NAVIGATOR_L1_API_KEY: ${NAVIGATOR_L1_API_KEY:-}
      NAVIGATOR_L2_URL: ${NAVIGATOR_L2_URL:-}
      NAVIGATOR_L2_MODEL: ${NAVIGATOR_L2_MODEL:-}
      NAVIGATOR_L2_API_KEY: ${NAVIGATOR_L2_API_KEY:-}
      AG_UI_URL: ${AG_UI_URL:-}
      AG_UI_TOKEN: ${AG_UI_TOKEN:-}
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  typesense_data:
  nats_data:
  postgres_data:
  seaweedfs_data:
  memory_data:
