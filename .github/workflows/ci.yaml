name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      TYPESENSE_URL: http://127.0.0.1:58108
      TYPESENSE_API_KEY: space_local_search
      NATS_URL: nats://127.0.0.1:4222
      TEST_NATS_URL: nats://127.0.0.1:4222
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/workplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install PDF rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils util-linux fonts-liberation
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck --concurrency=2
      - name: Start durable event infrastructure
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d workplace_test -c "ALTER SYSTEM SET wal_level='logical'"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d workplace_test -c "ALTER SYSTEM SET max_replication_slots=20"
          docker restart "$POSTGRES_CONTAINER"
          docker run -d --name space-typesense --tmpfs /data -p 58108:8108 typesense/typesense:30.2 --data-dir=/data --api-key=space_local_search
          docker run -d --name space-nats -p 4222:4222 -v "$PWD/config/nats.conf:/etc/nats/space.conf:ro" nats:2.15.2-alpine -c /etc/nats/space.conf
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d workplace_test && docker exec space-nats sh -c 'nc -z 127.0.0.1 4222' && curl --fail --silent http://127.0.0.1:58108/health; then break; fi
            sleep 1
          done
          DATABASE_URL="$TEST_DATABASE_URL" NATS_URL="$TEST_NATS_URL" node apps/events/dist/main.js > /tmp/space-cdc.log 2>&1 &
          cdc_pid=$!
          for attempt in $(seq 1 30); do
            if grep -q 'CDC ready' /tmp/space-cdc.log; then exit 0; fi
            if ! kill -0 "$cdc_pid" 2>/dev/null; then cat /tmp/space-cdc.log; exit 1; fi
            sleep 1
          done
          cat /tmp/space-cdc.log
          exit 1
      - name: Test
        run: pnpm exec turbo run test --concurrency=1

      - name: Event infrastructure diagnostics
        if: failure()
        run: |
          tail -n 200 /tmp/space-cdc.log || true
          docker logs --tail 100 space-nats || true

      - name: Browser search E2E
        run: |
          pnpm --filter @space/tests exec playwright install --with-deps chromium
          pnpm --filter @space/tests test:search:e2e

  release:
    needs: checks
    if: github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^v${number}\.${number}\.${number}(-(alpha|beta|rc)\.${number})?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH, optionally followed by -alpha.N, -beta.N, or -rc.N.' >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          flags=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${flags[@]}"
