name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/workplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PDF rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils util-linux fonts-liberation
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck --concurrency=2
      - name: Test
        run: pnpm exec turbo run test --concurrency=1
