name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      NATS_URL: nats://127.0.0.1:4222
      TEST_NATS_URL: nats://127.0.0.1:4222
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/workplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install PDF rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils util-linux fonts-liberation
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck --concurrency=2
      - name: Start durable event infrastructure
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d workplace_test -c "ALTER SYSTEM SET wal_level='logical'"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d workplace_test -c "ALTER SYSTEM SET max_replication_slots=20"
          docker restart "$POSTGRES_CONTAINER"
          docker run -d --name space-nats -p 4222:4222 -v "$PWD/config/nats.conf:/etc/nats/space.conf:ro" nats:2.15.2-alpine -c /etc/nats/space.conf
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d workplace_test && docker exec space-nats sh -c 'nc -z 127.0.0.1 4222'; then break; fi
            sleep 1
          done
          DATABASE_URL="$TEST_DATABASE_URL" NATS_URL="$TEST_NATS_URL" node apps/events/dist/main.js > /tmp/space-cdc.log 2>&1 &
          cdc_pid=$!
          for attempt in $(seq 1 30); do
            if grep -q 'CDC ready' /tmp/space-cdc.log; then exit 0; fi
            if ! kill -0 "$cdc_pid" 2>/dev/null; then cat /tmp/space-cdc.log; exit 1; fi
            sleep 1
          done
          cat /tmp/space-cdc.log
          exit 1
      - name: Test
        run: pnpm exec turbo run test --concurrency=1
