services:
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0.1
    volumes:
      - ./deploy/onlyoffice/space-agent:/var/www/onlyoffice/documentserver/sdkjs-plugins/space-agent:ro
    ports:
      - "127.0.0.1:58080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a shared ONLYOFFICE_JWT_SECRET}
    restart: unless-stopped
  server:
    environment:
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://127.0.0.1:58080}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a shared ONLYOFFICE_JWT_SECRET}
      ONLYOFFICE_STORAGE_ENDPOINT: http://seaweedfs:8333
      ONLYOFFICE_CALLBACK_BASE: http://server:3000
