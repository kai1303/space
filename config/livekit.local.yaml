port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  node_ip: 127.0.0.1
  use_external_ip: false
room:
  auto_create: false
  max_participants: 12
  empty_timeout: 60
  departure_timeout: 15
# Public local-development credentials, never use on a reachable deployment.
keys:
  space_local: space_local_huddle_secret_do_not_deploy
webhook:
  api_key: space_local
  urls: ["http://host.docker.internal:3002/v1/huddles/webhook"]
