# Local failure rehearsal only: no public listener or production credentials.
server_name: $NATS_SERVER_NAME
port: 4222
http_port: 8222
max_connections: 2048
max_payload: 1MB
max_pending: 8MB
write_deadline: 5s
jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 2GB
  sync_interval: always
}
cluster {
  name: space-rehearsal
  port: 6222
  routes: [nats://nats-1:6222, nats://nats-2:6222, nats://nats-3:6222]
}
