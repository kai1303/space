global
  log stdout format raw local0
  maxconn 2000
  stats socket /tmp/haproxy-admin.sock mode 600 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout queue 2s
  timeout tunnel 1h

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend api
  bind :8080
  # This listener is private, behind a separately managed HTTPS edge.
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  default_backend space_api

backend space_api
  balance leastconn
  option http-server-close
  option httpchk
  http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none maxconn 1000 maxqueue 128
  server api-1 api-1:3000
  server api-2 api-2:3000
