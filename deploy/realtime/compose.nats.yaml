# Isolated single-host failure rehearsal; not a production HA deployment.
x-broker: &broker
  image: nats:2.15.2-alpine
  command: ["-c", "/etc/nats/space.conf"]
  ports: ["127.0.0.1::4222"]
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
    interval: 2s
    timeout: 2s
    retries: 30
services:
  nats-1:
    <<: *broker
    environment: { NATS_SERVER_NAME: nats-1 }
    volumes: ["./nats.conf:/etc/nats/space.conf:ro", "nats_1:/data"]
  nats-2:
    <<: *broker
    environment: { NATS_SERVER_NAME: nats-2 }
    volumes: ["./nats.conf:/etc/nats/space.conf:ro", "nats_2:/data"]
  nats-3:
    <<: *broker
    environment: { NATS_SERVER_NAME: nats-3 }
    volumes: ["./nats.conf:/etc/nats/space.conf:ro", "nats_3:/data"]
volumes:
  nats_1:
  nats_2:
  nats_3:
