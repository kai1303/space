apiVersion: 1
datasources:
  - name: Space metrics
    uid: space-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Space logs
    uid: space-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
